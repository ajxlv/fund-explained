[project]
name = "fund-explained"
version = "0.1.0"
description = "Plain-English report cards for Indian mutual funds. Explains, never recommends."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint.per-file-ignores]
# Copied verbatim from the plan (must not be edited); its BLE001 noqa is for a rule we don't enable.
"scripts/fetch_navs.py" = ["RUF100"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
